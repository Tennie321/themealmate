services:
  remote-browser:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      PORT: "8787"
      ASTRA_BROWSER_SECRET: ${ASTRA_BROWSER_SECRET:?Set a random shared secret of at least 32 characters}
      ASTRA_BROWSER_ORIGIN: ${ASTRA_BROWSER_ORIGIN:?Set the Astra app origin, e.g. https://your-app.example}
      BROWSER_PROFILE_DIR: /home/pwuser/astra-browser/profile
    volumes:
      - browser-profile:/home/pwuser/astra-browser
    shm_size: 1gb
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  browser-profile:
