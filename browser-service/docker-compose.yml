services:
  browser:
    build: .
    init: true
    restart: unless-stopped
    shm_size: "1gb"
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      ASTRA_BROWSER_SHARED_SECRET: ${ASTRA_BROWSER_SHARED_SECRET:?Set a shared random secret}
      ASTRA_ALLOWED_ORIGIN: ${ASTRA_ALLOWED_ORIGIN:?Set your exact app origin}
      BROWSER_PROFILE_DIR: /data/profile
    volumes:
      - browser_profile:/data
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
volumes:
  browser_profile:
