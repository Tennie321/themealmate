services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: "0.0.0.0"
      LOVABLE_API_KEY: ${LOVABLE_API_KEY:-}
      ASTRA_ACCESS_CODE: ${ASTRA_ACCESS_CODE:-}
      ASTRA_SESSION_SECRET: ${ASTRA_SESSION_SECRET:-}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
    restart: unless-stopped
  browser:
    build:
      context: ./browser-service
      dockerfile: Dockerfile
    environment:
      PORT: "8787"
      PROFILE_DIR: /home/pwuser/profile
      REMOTE_BROWSER_ACCESS_CODE: ${REMOTE_BROWSER_ACCESS_CODE:?Set a long remote browser code in your local .env}
      REMOTE_BROWSER_SESSION_SECRET: ${REMOTE_BROWSER_SESSION_SECRET:?Set a 32+ character remote browser session secret in .env}
    volumes:
      - browser-profile:/home/pwuser/profile
    shm_size: "1gb"
    init: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
  gateway:
    image: nginx:1.27-alpine
    depends_on:
      - app
      - browser
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${ASTRA_BIND_PORT:-8080}:80"
    restart: unless-stopped
volumes:
  browser-profile:
