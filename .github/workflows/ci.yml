name: Astra CI
on:
  push:
    branches:
      - main
      - feat/**
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build and generate routes
        run: npm run build
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Security regression tests
        run: npm run test:security
      - name: Browser protocol security tests
        run: npm --prefix browser-service test
