services:
  browser-bridge:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      - PORT=8787
      - PROFILE_ROOT=/data/profiles
      - APP_ORIGIN
      - BROWSER_BRIDGE_SECRET
    volumes:
      - browser-profiles:/data/profiles
    shm_size: "1gb"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  browser-profiles:
